    status: pass
    evidence:
      - test: ASVS-8.1.1
      - doc: docs/security/authorization.md
      - doc: modules/core-authz/README.md
      - doc: docs/adr/0014-authorisation-model-and-dependency-direction.md
      - doc: docs/adr/0005-deny-by-default-before-authz.md
    note: 'docs/security/authorization.md is the single place: the two checks (route permission, then the service with the resource), one table of every route with its permission, the rules on one resource (own sessions, tokens, inbox items, pending accounts, role assignment) and the rules that hold for Admin too. The route table is generated from the live registry and a tagged test fails when the page differs from it. The mechanics of a decision stay in the core.authz README and the two ADRs, which the page links. Resource policies exist as a mechanism and are tested with a fixture module; the page gets their rows when the registry modules add real ones (M7).'
  - id: v5.0.0-8.1.2
    status: pass
    evidence:
      - doc: docs/security/authorization.md
      - code: modules/core-identity/validation.ts
      - code: apps/server/src/response-fields.test.ts
    note: 'The section "Fields, per object" of docs/security/authorization.md gives, for user, role, token, session, inbox item, setting, secret, vocabulary, preference, file, audit entry, delivery and the mail and login tokens: who reads which fields, who writes which, which fields only a dedicated route changes (status, roles, the password) and which are never returned. It also states the state-dependent rules (a pending account, a revoked token). A page is a description and not a test: the tests that enforce each rule are named in the page, and the second pass should read the tables against the response schemas.'
