    note: 'docs/security/authorization.md is the single place: the two checks (route permission, then the service with the resource), one table of every route with its permission, the rules on one resource (own sessions, tokens, inbox items, pending accounts, role assignment) and the rules that hold for Admin too. The route table is generated from the live registry and a tagged test fails when the page differs from it. The mechanics of a decision stay in the core.authz README and the two ADRs, which the page links. Resource policies exist as a mechanism and are tested with a fixture module; the page gets their rows when the registry modules add real ones (M7). M5 sprint 3 added six routes (the administrator''s user list, one user, the roles and tokens of a user, deactivation, and the permissions of a role); they are in the generated table and the same test fails for any that is missing. M5 sprint 4 added GET /permissions (core.authz.role.read) and GET /account/permissions (core.authz.account.read, the caller''s own permissions, limited to the scopes of an access token); both are in the generated table and in the walker. `GET /inbox/stream` (sprint 4, ADR-0028) is a self-service route in the walker: it has no id in the request, so there is no other person''s stream to open (apps/server/src/inbox-stream-routes.test.ts: a user id in the address changes nothing), it needs `core.notifications.inbox.read` on the route and again in the service, an access token needs the scope, and every heartbeat re-checks the permission and the credentials. M6 sprint 3 (ADR-0034) added the first delegated role: an organisation manager decides membership requests, changes roles and removes plain members of that one organisation. The rules are written down in three places that the second pass can read against the code: the table of who may do what in docs/adr/0034-scoped-permissions-at-the-route-and-delegation.md, the rows "Membership request, withdrawal, leave", "Membership decision, role, removal", "Member list" and "Organisation contact point" of the section "Rules on one resource" of docs/security/authorization.md (with the rules that hold for Admin too: nobody decides on their own request, changes their own role or removes themselves, a manager never removes a manager), and the README of registry.organisations. The nine membership routes are in the generated route table, and the page says in a note which of them are delegated: they name the plain organisation.read that every signed-in person holds and the service is the authorization, which is why the defect-1 matrix expects 403 for a plain User on each. Resource policies are now real: the policy organisation.member is tested through the real authoriser in modules/registry-organisations/service/policy.test.ts (every kind of reader against every scoped permission, a token without the scope, per-call reads, the approval rule). M6 sprint 4 (ADR-0033, Decision 14) added the second use of the policy, the edit of the organisation record by its managers: the scoped permission organisation.edit and its row in the policy (policy.test.ts, the edit row), the field-rules table (service/field-rules.ts: type, abbreviation and name need organisation.manage, the descriptive fields and the logo need organisation.edit on that organisation), the final rules in ADR-0033 (section Two editor groups and the field rules per role) and the section Organisation of Fields, per object in docs/security/authorization.md. The three edit routes (PATCH /organisations/{id}, PUT and DELETE /organisations/{id}/logo) are delegated like the membership routes and the page says so in the same note. M7 sprint 2 (ADR-0036) adds the second resource policy, service.member, and the first record with three groups on one resource. The rules are written down in docs/adr/0036-service-access.md (the table of who holds which permission, the three groups, the order 404 - 403 - 422, the rename and the history), in the rows Service create, Service edit, Service slug rename, Service publication and Service contact point of the section Rules on one resource of docs/security/authorization.md, in the section Service of Fields, per object, and in the README of registry.services. The six new routes (PATCH /services/{id}, PUT and DELETE /services/{id}/icon, PUT /services/{id}/publication, and POST /services now with service.create) are in the generated route table, and the page says in a note which of them are delegated: they name the plain service.read that every signed-in person holds and the service is the authorization, which is why the defect-1 matrix expects 403 for a plain User on each. The policy is tested through the real authoriser in modules/registry-services/service/policy.test.ts (every kind of reader against each of the three scoped permissions, a token without the scope, per-call reads and the move of a service). The prototype that preceded it is modules/registry-services/service/access-prototype.test.ts with apps/server/src/defect-01.service-routes-prototype.test.ts: it needed no change in a scoped path. M8 sprint 1 adds the section "The public API (v1)" to docs/security/authorization.md: a v1 route is never public except GET /api/v1/openapi.json (the description of the API), a call needs a token whose scopes name the permission and whose owner holds it, CORS and the audit of v1 calls; the route table includes the spec route (module public-api). The v1 field tables arrive with the first v1 data routes (sprint 2). M8 sprint 2 adds the four v1 routes to the generated route table, named with the prefix /api/v1 because a v1 route shares its path with an internal one (providers and services), and the v1 rows of the field tables (The v1 rows, token). The route table test stays tagged and fails when the page differs from the registry. M8 sprint 3 adds the subsection "The API reference" to the section "The public API (v1)" of docs/security/authorization.md: the reference at /docs/reference is a document of the web shell, public by design and holding no record, and it decides nothing (the server answers every call it sends); ADR-0038 records its policy.'

