    status: pass
    evidence:
      - test: ASVS-8.3.1
      - code: apps/server/src/pipeline/authorize.ts
      - code: modules/core-authz/service/authz.ts
    note: 'Authorization runs on the server in the pipeline and again in the service (ctx.authz.require); roles sent by a client are ignored (ADR-0014). Navigation hiding in the UI is cosmetic.'
