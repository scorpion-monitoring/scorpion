    note: 'Authorization runs on the server in the pipeline and again in the service (ctx.authz.require); roles sent by a client are ignored (ADR-0014). Navigation hiding in the UI is cosmetic: the catch-all route of the web app opens a page only when the server lists it for the caller (GET /ui/navigation), and a public page must be named in PUBLIC_PAGES with a reason (apps/server/src/ui-routes.test.ts). M5 sprint 2 added two public routes, GET /auth/oidc/providers (id, display name and icon hash only) and GET /bootstrap/status (one boolean), each with its reason and in the generated route table of docs/security/authorization.md, and the sign-in, registration, recovery and first-admin pages; the profile page needs core.identity.profile.read. The page walker in apps/server/src/ui-navigation-routes.test.ts shows a plain User only the profile and public pages, and apps/web/e2e/navigation.spec.ts finds nothing of the administration in their navigation. The administration pages of M5 sprint 3 (users, pending approvals, roles, settings) are registered with a permission, so the same list gives a plain User none of them and the catch-all route answers their paths with 403 (apps/web/e2e/admin.spec.ts). M6 sprint 3 is the first case where the route alone would let everybody through: the delegated membership routes name the plain organisation.read, so the check that keeps a plain User out is the one in the service (ctx.authz.require with the scoped permission and the organisation, ADR-0034). The tagged tests show the service refusing a caller the route accepted (defect-01.membership.test.ts, "turns a plain member, a person who asked and a plain User away at the service though the route accepted them"), and the walker rows of the delegated routes fail if the service check is missing (an unknown id would answer 404 or 200 instead of 403). The prototype that compared the two route designs is apps/server/src/defect-01.delegated-routes-prototype.test.ts. M6 sprint 4 is the second case where the route alone would let everybody through: PATCH /organisations/{id} and the two logo routes name the plain organisation.read, so the check that keeps a plain User, a member and a manager of another organisation out is the one in the service (accessLevel and requireAccess in service/organisations.ts, before blob.put for a logo). The tagged test in apps/server/src/organisation-editing-routes.test.ts (the route alone would let the caller through) shows the same caller reading the organisation (200) and being refused every edit (403), and the walker rows of the three routes fail if the service check is missing. M7 sprint 2 is the third case where the route alone would let everybody through: PATCH /services/{id} and the two icon routes name the plain service.read, so the check that keeps a plain User, a Reviewer, a person who only asked and a member of another provider out, and that keeps a member away from the slug and the provider, is the one in the service (accessLevel and requireAccess in service/services.ts, before blob.put for an icon). The tagged tests in apps/server/src/service-editing-routes.test.ts (the route alone would let the caller through) show the same callers reading the service (200) and being refused every edit (403) with no file stored, and the walker rows of the delegated routes fail if the service check is missing. POST /services names service.create, which every User holds, and the service refuses a person who is not Admin or an approved member of the provider (create-access.test.ts). M7 sprint 3: a non-public service is 404 for an anonymous reader on every public route, with the body of an unknown id, whoever asks and whatever the route (a stale cookie or a token changes nothing, public-service-routes.test.ts), and the contact point never leaves in any public answer; the check is in the service read (the flag in the same statement), not in the page. M8 sprint 1: on a v1 route the pipeline checks the permission against the token''s scopes and its owner''s permissions before the handler (tagged test in apps/server/src/public-api-routes.test.ts: 401 without a token, 403 without the scope, 403 when the owner does not hold the permission). M8 sprint 2: on the four v1 routes the authorization runs in the pipeline (the route permission against the scopes of the token and the permissions of its owner) and again in the service method, and a token that names the scope of the other v1 family is refused (403) on each route. M8 sprint 3: the API reference runs in the browser but enforces nothing. In the tagged journey (apps/web/e2e/reference.spec.ts) the same page and the same code give 200, 403 or 401 depending only on the token, because the decision is the server-side pipeline and the service (a page cannot widen it); the reference cannot send the token to another host (connect-src self). M9 sprint 3 adds the third scoped permission, kpi.framework.service.kpis.edit (the KPIs of a service), as a fourth use of the pattern of ADR-0034: the route PUT /kpi/services/{id}/kpis names the plain kpi.framework.set.read, the service calls ctx.authz.require with the service, and kpi.framework contributes its own authz.resourcePolicy entry for the resource type service, which asks registry.services (isProviderManagerAsSystem, the policy service.member of ADR-0036 part 4) at every call. Both new routes of the KPIs of a service and the two v1 KPI routes are in the generated route table, and the section The KPIs of a service of docs/security/authorization.md says who reads and who writes each part. M9 sprint 3 adds the section The KPIs of a service to Fields, per object (the set, the extras, the effective list, canEdit and the kpiSet of the create body, with who reads and who writes each) and the KPI rows of The v1 rows (token). The names of the two new v1 answers and of the new category of the service row are pinned in apps/server/src/response-fields.test.ts, and the create schema''s showIf properties are pinned there too. M9 sprint 3: a plain member of the provider, a manager of another provider, a plain user, a requested or left membership and an anonymous caller cannot change the KPIs of a service (modules/kpi-framework/service/service-kpis.test.ts, the scoped permission describe, and apps/server/src/defect-14.service-kpis.test.ts through the whole pipeline), while the approved managers of the provider and Admin can; the v1 KPI reads need a token that holds kpi.framework.v1.read (apps/server/src/kpi.contract.test.ts). M9 sprint 3 adds the two v1 KPI reads and the category of the service row: the names of every answer are pinned in apps/server/src/response-fields.test.ts and the definitions they return hold no value, service or person (the selected flag answers only for the service the caller names). M9 sprint 3: the scoped permission of the KPIs of a service is read at every call against the provider''s current membership, so a removal is seen at the next call, and a token needs the scope kpi.framework.v1.read as well as an owner who holds it (modules/kpi-framework/service/service-kpis.test.ts ''sees a demotion at the next call'', apps/server/src/kpi.contract.test.ts ''the scope of the KPI family''). M9 sprint 4 adds four RDF reads of the KPI definitions: GET /api/v1/kpi/rimo.ttl and .jsonld need a token that holds kpi.framework.v1.read (or a session of a person who holds it), checked in the pipeline and again in the service, and a token of the services scope is 403 (apps/server/src/kpi.contract.test.ts, apps/server/src/kpi-rdf-routes.test.ts, tagged). GET /public/kpi/rimo.ttl and .jsonld are public with a reason in the route (the definitions are the shared vocabulary of the instance); they hold no service, person, token, contact point or value because the model they are written from has no field for any of them, and a test fills a database with all of those and fails when a marker of one appears in a body or a header of the four answers (apps/server/src/kpi-rdf-routes.test.ts, tagged ASVS-8.3.1). A person whose role lacks the permission is 403 on the v1 pair, session or token (tagged ASVS-8.2.1). The section The RDF reads of the KPIs of docs/security/authorization.md says what they expose and why one pair needs a token and the other is public. kpi.ingestion (M10) adds the fourth scoped permission, kpi.ingestion.measurement.submit (submitting measurements for one service), as a fifth use of the pattern of ADR-0034. upsertBatch is the one write path and calls ctx.authz.require with the service before it looks anything up, and kpi.ingestion contributes its own authz.resourcePolicy entry for the resource type service, which asks registry.services (isProviderMemberAsSystem) at every call and keeps nothing, so a removal or a leave is seen at the next call. An anonymous caller is 401 and a plain user, a Reviewer, a requested, rejected or left membership and a member of another provider are 403, a dry run included, whether or not the service exists, while Admin and the approved members of the provider can submit (modules/kpi-ingestion/service/access.test.ts, tagged); a token needs the scope as well as an owner who may submit. The write through the public API is checked twice, by scope and owner in the pipeline and by the scoped permission in the service, and the same holds for the ingestion routes (preview, run, history, template): the route names a plain permission and the service decides, with a denied case per caller class, at the service and through the whole pipeline (modules/kpi-ingestion/service/by-name.test.ts and service/ingestion.test.ts, apps/server/src/measurements.contract.test.ts, defect-06.v1-measurements.test.ts, ingestion-routes.test.ts and defect-01.privilege-escalation.test.ts, tagged). The reporting reminder (sprint 5) applies the rule to a send: a person is mailed for a provider''s services only if they are an approved member of that provider (a requested, rejected or left membership, another provider''s members and an administrator who is no member are not), have an active account and an address, and may submit now, because the module''s own policy is asked for each service named at the moment of the send; a service of one provider is never named to the members of another, and a member removed before the run is not mailed (modules/kpi-ingestion/service/reminder.test.ts, tagged). The section Measurements and ingestion runs of docs/security/authorization.md says who reads and who writes each field and who is mailed, and ADR-0041 decision 4 records the rule. M11 sprint 1 adds the two dashboard routes (core.ui-shell): GET /ui/dashboard needs core.ui-shell.dashboard.read and PUT /ui/dashboard needs core.ui-shell.dashboard.write, both plain permissions held by the role user, and the service (modules/core-ui-shell/service/dashboard/service.ts) checks the same permission again with ctx authz require before it reads or writes, acts only for a signed-in user, and takes no user id: the owner is the actor, and the document is stored through the public setUserPreference of core.settings, which checks core.settings.preference.write for the same actor. The permission of a tile is its widget''s, decided per request on every read and every save: a person who lost a widget''s permission gets the tile left out with a reason and the stored document is not rewritten by the read. The tests tagged ASVS-8.3.1 in apps/server/src/ui-dashboard-routes.test.ts prove 401 for anonymous and 403 for a caller without the permission on both routes (and for a writer without the preference permission), the second check in the service for a caller who bypasses the route, and the dropped tile for a lost widget permission.'

