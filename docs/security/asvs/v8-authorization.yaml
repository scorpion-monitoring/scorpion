    note: 'Scorpion has no field-level permission engine, by decision (M4b Decision 9); field access is kept by construction. Read side: every route returns one fixed response schema, and the tagged walker reads the response schema of every route of the live registry at any depth (arrays, unions, optionals, references) and fails on secretHash, passwordHash, tokenHash, clientSecret, secret, password or token, with the two one-time token responses (token create and rotate) as the only named exceptions; a planted violation is proved to be named. The audit of every response schema found no such field, and a further test in the same file checks the declared event payloads. Write side: every request body is a strict Zod object, so status, roles, userId or any unknown field is a 422, and status and roles change only through their own permissioned routes. Not shown: that a real response holds only what its schema declares (no step validates a response body; services build named fields, and the route tests for tokens, secrets, settings and the audit trail read real responses; docs/backlog.md schedules a check in the contract tests), that a free-form value such as a setting holds no secret-named key, and that a field is right for its reader. That is a review of the tables in docs/security/authorization.md against each schema, not something a test decides. M6 sprint 4 is the first case of field-level write rules by role, kept by construction in one table (service/field-rules.ts): a manager of an organisation who names type, abbreviation or name, alone or with allowed fields, is refused whole with 403, the problem names the field and never a value, and nothing is written, no event is emitted (editing.test.ts and organisation-editing-routes.test.ts, tagged); GET /organisations/{id} returns editableFields computed by the same table, so a screen draws its form from what the server will accept. On the read side the contact point of an organisation shows only to the readers the table names (Admin and the managers of that organisation always, others while the setting is on; editing.test.ts and organisation-routes.test.ts), and the walker in response-fields.test.ts fails if any route outside the six it names declares a contact field or if an event payload of the module declares a field that carries a value. M6 sprint 5 names the membership as the third object: the walker "the fields of a membership" in response-fields.test.ts (tagged) pins, route by route, the names a membership answer may carry (the member list only username and since; the person''s own rows and the decider''s rows the fields of the table, with allowedActions) and fails on an email, an address, decidedBy or endedBy in any of them, and a second check fails when a route that names a membership is not in the list or an own-row route. Reads still have one schema per route, so two readers of one route see the same fields except where the table names a reader-dependent field (the contact point, the audit columns, editableFields, allowedActions), which the service computes per caller. M7 sprint 2 is the second case of field-level write rules by group, and the first with two levels inside one resource, kept by construction in one table (service/field-rules.ts): a member of the provider who names the slug or the provider, alone or with allowed fields, is refused whole with 403, the problem names the field and never a value, nothing is written and no event is emitted (editing.test.ts and service-editing-routes.test.ts, tagged); a manager may change both, and Admin everything; GET /services/{id} returns editableFields and allowedActions computed by the same table, for each kind of caller (editing.test.ts, service-editing-routes.test.ts). On the read side the contact point of a service shows only to the readers the table names (Admin and the provider members always, others while the setting is on, editing.test.ts and service-editing-routes.test.ts), and the walker in response-fields.test.ts fails if a route outside the ones that return the record declares a contact field, or if an event payload of the module declares a field that carries a value. The events of an update name field keys and never a value (editing.test.ts, the audit rows in service-editing-routes.test.ts). The flag public has its own route and permission, so no patch can set it (publication.test.ts). M7 sprint 3: the public service record and the public organisation record are separate response schemas whose property names are PINNED: apps/server/src/public-records.test.ts walks the live registry and compares every property of both, at any depth, with a list in the test, so a field added to either fails until the ADR, the field table in docs/security/authorization.md and the list change together; it also fails on a private name (contact, editableFields, allowedActions, values, audit columns, published, member, email, type) in any answer of a public route. The contact point is never in a profile or a public answer (the contact walker of response-fields.test.ts, the service and organisation profile tests, public-service-routes.test.ts: no contact point leaves). M8 sprint 2: a second walker in response-fields.test.ts reads the response schemas of the v1 routes, pins the names of each v1 answer to the v1 rows of docs/security/authorization.md and fails on a contact field, an audit column or a hint for the screens, with a planted violation proved to be named. The service methods return a pinned row and tests assert the exact field set with a contact point, an icon and configured values in the data, and defect-15.v1-reads.test.ts keeps the filters of the two lists true (is_member, consortia, the filtered totalCount). The names of the measurement answers are pinned in apps/server/src/response-fields.test.ts (kpi, value, date and the added id, indicatorId, iri, service, period, valueNumber; the counts of the write; the grid row and the coverage month), and V1_NEVER fails a route that declares actorId, fileName, runId or source, so no answer holds the id of the person who wrote a value, a file name, a run or the adapter. The reporting reminder''s mail holds the provider''s name, the month, the names of services and indicators (bounded, then a count) and a link, and never a measured value, a person or another provider''s service; its data schema is strict and has no field a value could travel in, and its table kpii_reminder_sent holds two counts and no person or name (modules/kpi-ingestion/templates/reporting-reminder.test.ts and service/reminder.test.ts, tagged). M11 sprint 1 adds the dashboard of the signed-in caller (core.ui-shell, ADR-0042): one document in the user preference core.ui-shell.dashboard, read through GET /ui/dashboard and written through PUT /ui/dashboard. The field table is the section "The dashboard (signed-in)" of docs/security/authorization.md: who reads and writes the tiles and their configuration (the owner), what is computed and never written (dropped, reset), and what is never in it or in an answer (a user id, a name, a role, a permission, a token, a secret, an address). The stored value and the served value differ on purpose: the generic PUT /preferences/core.ui-shell.dashboard can store only what passes a structural schema, and parseDashboard repairs or replaces whatever is stored on every read (unknown widget, widget the caller may not see, bad size, overlap, bad configuration, more than 20 tiles, a version it does not know), so a planted document is never served as stored. The tests tagged ASVS-8.2.3 in apps/server/src/ui-dashboard-routes.test.ts prove the repair of a planted document, the replacement of an oversize or newer-version one, two people''s documents kept apart with no route that names a user, and a 422 that names the field and never repeats a value; document.test.ts proves with fast-check that any input parses without throwing into a valid, packed document of at most 8 KiB.'

