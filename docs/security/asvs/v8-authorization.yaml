    note: "Every route declares a permission (or public: true with a reason) or fails at registration; the pipeline denies by default. The walker in defect-01 fails for a route without a decision in its matrix; the six routes of M5 sprint 3 and GET /permissions, GET /system/job-runs of sprint 4 are in it as admin routes (GET /account/permissions as a self-service route), so a plain User, a user without roles, anonymous and a token whose owner is a plain User are refused on each, and apps/server/src/admin-users-routes.test.ts repeats the refusals with the handler's own side effects checked (nothing changes). M6 sprint 3 adds the function-level cases of delegation, tagged in modules/registry-organisations and apps/server: a plain User, a plain member, a person who only asked and a manager of another organisation cannot decide a request, change a role, remove a member, list requests or view members (memberships.decisions.test.ts, memberships.lists.test.ts, defect-01.membership.test.ts); nobody decides on their own request, changes their own role or removes themselves, an Admin and a manager included; a manager cannot remove another manager; a token passes only for the scopes it names and only for what its owner holds, so an Admin or a manager token without the scope is refused, also on a list (which answers 403, not an empty page); and the nine membership routes are rows of the walker in defect-01.privilege-escalation.test.ts, where a plain User gets 403 on each delegated row, which proves the service answer and not the pipeline. M6 sprint 4 adds the function-level cases of editing, tagged in modules/registry-organisations and apps/server: a plain member, a person who only asked, a rejected or former member, a plain User and a manager of another organisation cannot change an organisation or set or remove its logo, and a manager cannot create or delete an organisation, not even their own (editing.test.ts, organisation-editing-routes.test.ts); a manager demoted or removed is refused at the next call; a token passes only for the scopes it names, so a manager or Admin token without the scope of the edit is refused, and a member or a plain User naming the scope gains nothing (editing.test.ts, policy.test.ts, the edit row); and the three edit routes (PATCH, PUT and DELETE logo) are rows of the walker, where a plain User gets 403 from the service (the sample names a real organisation, because an unknown one is 404 first). M7 sprint 2 adds the function-level cases of editing a service, tagged in modules/registry-services and apps/server: a plain User, a Reviewer, a person who only asked, a rejected or former member and a manager of another organisation cannot change a service or set or remove its icon (editing.test.ts, icon.test.ts, service-editing-routes.test.ts), and the denied icon call leaves no file in the blob store (the check runs before blob.put); a member cannot change the slug or the provider, alone or mixed with allowed fields, and the request is refused whole with nothing written; a manager cannot move a service to an organisation they do not manage; a demoted manager is refused the identity at the next call, a manager who left is refused everything, and a token passes only for the scopes it names (editing.test.ts, policy.test.ts, service-editing-routes.test.ts); nobody but a Reviewer or Admin switches publication, a manager or a member included (publication.test.ts); and creating a service needs Admin or an approved member of the chosen provider (create-access.test.ts). The four new edit routes are rows of the walker in defect-01.privilege-escalation.test.ts, where a plain User gets 403 from the service on each delegated row (the sample names a real service, because an unknown one is 404 first) and a token whose owner is a plain User gets nothing from the new scoped permissions. M7 sprint 3 (ADR-0036 part 2) adds the first anonymous reads of per-resource data, and they are tested as an access control: a service is readable without signing in only while its public flag is set (Reviewers and Admin set it) and service.allowPublic is on. A service that is private, one that was unpublished, an unknown id or slug, an organisation whose only link is to a private service, an id that is no UUID, and every public address while service.allowPublic is off all answer the same 404 with the same body as an unknown id, never a 403 (apps/server/src/public-service-routes.test.ts, the identical 404; modules/registry-services/service/public.test.ts), the flag is read in the same statement as the record so a publication racing a read gives a whole record or nothing, and an unpublish is seen at the next request (the server keeps no copy; a 200 says Cache-Control public, max-age=60, which is the only delay for a shared cache). The four public routes are exactly the ones the registry lists, each with a reason and none that writes (apps/server/src/public-records.test.ts). The prototype that preceded it, apps/server/src/public-routes-prototype.test.ts, showed that the rate limit, the cache header, the anonymous actor and the CSP needed no change in apps/server/src/pipeline or packages/contracts/src/route.ts. M8 sprint 1: a walker over the live registry (apps/server/src/public-api-full-profile.test.ts, tagged) fails when a v1 route other than GET /openapi.json is `public: true`, when a v1 route has no permission, and when a v1 path appears that nobody listed; the contract-test harness checks 401 without a token and 403 for a token without the scope on every v1 route (packages/testing/src/v1-contract.ts). M8 sprint 2 adds four v1 routes, each with its own permission (registry.organisations.v1.read and registry.services.v1.read, held by the role user by default) and audit: true. The walker of defect 1 keeps its matrix for the internal API and now requires every non-public v1 route to name a permission; the v1 contract harness proves 401 without a token and 403 for a token without the scope on each route, and a test per module method proves the service checks the v1 permission again (anonymous, a person without roles and a reviewer, who holds the plain read only, are refused). M8 sprint 3: the API reference (ADR-0038) is the documented way to try v1. The tagged journey in apps/web/e2e/reference.spec.ts makes a token on the profile page, pastes it into the reference and calls GET /providers: a token with the scope gets 200, a token that names only the other v1 permission gets 403 in the same panel, so function-level access is restricted to explicit permissions through this flow as well. The measurement routes of kpi.ingestion (M10) name a plain permission and the service decides. The scoped kpi.ingestion.measurement.submit is checked by upsertBatch and by the preview, the dry run, the commit, the run history and the import template, for every caller class: anonymous is 401; a plain user, a Reviewer, a person whose membership is requested, rejected or left, and a member of another provider are 403, whether or not the service exists and a dry run included; Admin and the approved members of the provider may submit (modules/kpi-ingestion/service/access.test.ts, service/ingestion.test.ts, service/by-name.test.ts, apps/server/src/ingestion-routes.test.ts, tagged). POST /api/v1/measurements names kpi.ingestion.v1.write, which the role user holds, and that is not enough: upsertByName asks the plain permission again, resolves the service by id or abbreviation (an unknown one is 422 naming service: a service is readable by every signed-in person) and then upsertBatch checks the scoped permission for the caller, so a plain User, a member of another provider, a person without a membership and a token without the scoped permission are 403 and nothing is written (apps/server/src/measurements.contract.test.ts, apps/server/src/defect-06.v1-measurements.test.ts, tagged). A token needs the scope of the route, the scope of the scoped permission and an owner who may submit; it needs nothing of kpi.framework, because upsertBatch reads the KPIs and bounds through a trusted read (effectiveIndicatorsAsSystem) after its own scoped check. The reads (GET /api/v1/measurements, GET /kpi/measurements, GET /kpi/measurements/coverage) need kpi.ingestion.v1.read or kpi.ingestion.measurement.read, held by the role user, and the service checks them again (modules/kpi-ingestion/service/reads.test.ts); preview and run name kpi.ingestion.measurement.ingest, a permission of its own so that a token that may only read cannot write; a run is read only by those who may submit for its service. The picker of the Data Submission page, GET /kpi/ingestion/services, names measurement.read, asks registry.services for the candidates and then asks the scoped permission for each row it keeps, so its list can only be shorter than the rule allows; a plain user gets an empty list, and a member of another provider does not find the service and is 403 on a direct call (service/access.test.ts, the row of the walker in defect-01.privilege-escalation.test.ts and the journey in apps/web/e2e/data-submission.spec.ts, tagged). The page decides nothing: its loader throws the 403 of the API. The four measurement routes and the picker are rows of their own walker and matrix in defect-01.privilege-escalation.test.ts (anonymous 401, no roles 403, a plain User reads and is 403 on the write, a token whose owner is a plain User and that names every scope is 403 on the write). The reporting reminder (M10 sprint 5) is a job that runs as the system and is reachable by no route and no token; who it mails is decided by the same rule, asked at the moment of the send (see 8.3.1)."

  - id: v5.0.0-8.2.2
