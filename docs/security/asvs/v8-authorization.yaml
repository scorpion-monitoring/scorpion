  - id: v5.0.0-8.2.3
    status: pass
    evidence:
      - test: ASVS-8.2.3
      - doc: docs/security/authorization.md
      - code: apps/server/src/response-fields.test.ts
      - code: modules/core-identity/validation.ts
    note: 'Scorpion has no field-level permission engine, by decision (M4b Decision 9); field access is kept by construction. Read side: every route returns one fixed response schema, and the tagged walker reads the response schema of every route of the live registry at any depth (arrays, unions, optionals, references) and fails on secretHash, passwordHash, tokenHash, clientSecret, secret, password or token, with the two one-time token responses (token create and rotate) as the only named exceptions; a planted violation is proved to be named. The audit of every response schema found no such field, and a further test in the same file checks the declared event payloads. Write side: every request body is a strict Zod object, so status, roles, userId or any unknown field is a 422, and status and roles change only through their own permissioned routes. Not shown: that a real response holds only what its schema declares (no step validates a response body; services build named fields, and the route tests for tokens, secrets, settings and the audit trail read real responses; docs/backlog.md schedules a check in the contract tests), that a free-form value such as a setting holds no secret-named key, and that a field is right for its reader. That is a review of the tables in docs/security/authorization.md against each schema, not something a test decides, and there is no per-role projection: two readers of one route see the same fields.'
