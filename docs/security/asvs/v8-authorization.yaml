    note: 'The section "Fields, per object" of docs/security/authorization.md gives, for user, role, token, session, inbox item, setting, secret, vocabulary, preference, file, audit entry, delivery and the mail and login tokens: who reads which fields, who writes which, which fields only a dedicated route changes (status, roles, the password) and which are never returned. It also states the state-dependent rules (a pending account, a revoked token). The user, role and token tables name the administrator''s reads and writes of M5 sprint 3 (what `GET /users` shows and leaves out, who edits the permissions of a role, which tokens an administrator may list). A page is a description and not a test: the tests that enforce each rule are named in the page, and the second pass should read the tables against the response schemas. M6 sprint 3 added the delegation rules to the page (the rows on one resource and the rules that hold for Admin too, see 8.1.1). M6 sprint 4 added the field table of the organisation (section Organisation of Fields, per object): for create and delete, type, abbreviation and name, description, website, sameAs and the ROR id, the logo, the contact point (who reads it: Admin and the managers of that organisation always, other signed-in people while organisation.exposeContactPoint is on, nobody anonymous, never in a list row, an event, an audit entry, a log line or a mail), memberCount, myMembership, editableFields and the audit columns, with who reads and who writes each (Admin, and the managers of that organisation for the descriptive fields and the logo). apps/server/src/response-fields.test.ts has a walker for the contact point: it may be declared by exactly the six routes the table names and by no list, member list or membership route, and no event of the module declares a field that carries a value of the record. M6 sprint 5 added the field table of the membership (section Membership of Fields, per object): the member list (usernames and join dates only, no state, role, address or id of the person; who may see it), the person''s own rows, the decider''s row (Admin for every organisation, a manager for their own, no email address, username null for a gone account), state and role with the state machine that is the only writer, allowedActions, the stored decidedBy, endedBy and roleChangedBy that no route returns (the audit trail holds who acted), and the summary. The member list and the own rows are still checked by memberships.lists.test.ts and apps/server/src/membership-routes.test.ts (no address in any answer), and the new walker "the fields of a membership" in apps/server/src/response-fields.test.ts pins the names each membership route may return, so a new field has to pass through the table. A page is still a description: the second pass reads the table against the schemas in routes.ts. M7 sprint 2 adds the field table of the service (section Service of Fields, per object in docs/security/authorization.md): create, slug, provider, name, licence and stage, description, URL and sameAs, the consortia, configured extra fields, the icon, the contact point (who reads it: Admin and the provider members always, other signed-in people while service.exposeContactPoint is on, nobody anonymous, never in a list row, an event, an audit entry, a log line or a mail), public (Reviewers and Admin only), editableFields, allowedActions and the audit columns, with who reads and who writes each. apps/server/src/response-fields.test.ts has the contact walker for the service: the contact fields may be declared by exactly the routes that return the record (the read, create, edit, icon and publication routes), by no list route, and by no event payload of the module. The tables are still a description: the second pass reads them against the schemas in modules/registry-services/routes.ts. M8 sprint 2 adds the section The v1 rows (token) to docs/security/authorization.md: for the provider row, the service row and record and the Schema.org profile it names the fields a token reads, who reads them, and the fields the internal read hides that v1 never returns (the contact point, audit columns, member counts, the person''s own membership rows, paths below the internal API, configured values, hints for the screens). The table is a description; the walker of 8.2.3 pins the names of each v1 answer, and the second pass reads the table against modules/registry-organisations/routes-v1.ts and modules/registry-services/routes-v1.ts.'

