  - id: v5.0.0-8.1.1
    status: pass
    evidence:
      - test: ASVS-8.1.1
      - doc: docs/security/authorization.md
      - doc: modules/core-authz/README.md
      - doc: docs/adr/0014-authorisation-model-and-dependency-direction.md
      - doc: docs/adr/0005-deny-by-default-before-authz.md
      - doc: docs/adr/0034-scoped-permissions-at-the-route-and-delegation.md
      - doc: modules/registry-organisations/README.md
      - code: modules/registry-organisations/service/policy.ts
    note: 'docs/security/authorization.md is the single place: the two checks (route permission, then the service with the resource), one table of every route with its permission, the rules on one resource (own sessions, tokens, inbox items, pending accounts, role assignment) and the rules that hold for Admin too. The route table is generated from the live registry and a tagged test fails when the page differs from it. The mechanics of a decision stay in the core.authz README and the two ADRs, which the page links. Resource policies exist as a mechanism and are tested with a fixture module; the page gets their rows when the registry modules add real ones (M7). M5 sprint 3 added six routes (the administrator''s user list, one user, the roles and tokens of a user, deactivation, and the permissions of a role); they are in the generated table and the same test fails for any that is missing. M5 sprint 4 added GET /permissions (core.authz.role.read) and GET /account/permissions (core.authz.account.read, the caller''s own permissions, limited to the scopes of an access token); both are in the generated table and in the walker. `GET /inbox/stream` (sprint 4, ADR-0028) is a self-service route in the walker: it has no id in the request, so there is no other person''s stream to open (apps/server/src/inbox-stream-routes.test.ts: a user id in the address changes nothing), it needs `core.notifications.inbox.read` on the route and again in the service, an access token needs the scope, and every heartbeat re-checks the permission and the credentials. M6 sprint 3 (ADR-0034) added the first delegated role: an organisation manager decides membership requests, changes roles and removes plain members of that one organisation. The rules are written down in three places that the second pass can read against the code: the table of who may do what in docs/adr/0034-scoped-permissions-at-the-route-and-delegation.md, the rows "Membership request, withdrawal, leave", "Membership decision, role, removal", "Member list" and "Organisation contact point" of the section "Rules on one resource" of docs/security/authorization.md (with the rules that hold for Admin too: nobody decides on their own request, changes their own role or removes themselves, a manager never removes a manager), and the README of registry.organisations. The nine membership routes are in the generated route table, and the page says in a note which of them are delegated: they name the plain organisation.read that every signed-in person holds and the service is the authorization, which is why the defect-1 matrix expects 403 for a plain User on each. Resource policies are now real: the policy organisation.member is tested through the real authoriser in modules/registry-organisations/service/policy.test.ts (every kind of reader against every scoped permission, a token without the scope, per-call reads, the approval rule). M6 sprint 4 (ADR-0033, Decision 14) added the second use of the policy, the edit of the organisation record by its managers: the scoped permission organisation.edit and its row in the policy (policy.test.ts, the edit row), the field-rules table (service/field-rules.ts: type, abbreviation and name need organisation.manage, the descriptive fields and the logo need organisation.edit on that organisation), the final rules in ADR-0033 (section Two editor groups and the field rules per role) and the section Organisation of Fields, per object in docs/security/authorization.md. The three edit routes (PATCH /organisations/{id}, PUT and DELETE /organisations/{id}/logo) are delegated like the membership routes and the page says so in the same note.'
  - id: v5.0.0-8.1.2
    status: pass
    evidence:
      - doc: docs/security/authorization.md
      - code: modules/core-identity/validation.ts
      - code: apps/server/src/response-fields.test.ts
    note: 'The section "Fields, per object" of docs/security/authorization.md gives, for user, role, token, session, inbox item, setting, secret, vocabulary, preference, file, audit entry, delivery and the mail and login tokens: who reads which fields, who writes which, which fields only a dedicated route changes (status, roles, the password) and which are never returned. It also states the state-dependent rules (a pending account, a revoked token). The user, role and token tables name the administrator''s reads and writes of M5 sprint 3 (what `GET /users` shows and leaves out, who edits the permissions of a role, which tokens an administrator may list). A page is a description and not a test: the tests that enforce each rule are named in the page, and the second pass should read the tables against the response schemas. M6 sprint 3 added the delegation rules to the page (the rows on one resource and the rules that hold for Admin too, see 8.1.1). M6 sprint 4 added the field table of the organisation (section Organisation of Fields, per object): for create and delete, type, abbreviation and name, description, website, sameAs and the ROR id, the logo, the contact point (who reads it: Admin and the managers of that organisation always, other signed-in people while organisation.exposeContactPoint is on, nobody anonymous, never in a list row, an event, an audit entry, a log line or a mail), memberCount, myMembership, editableFields and the audit columns, with who reads and who writes each (Admin, and the managers of that organisation for the descriptive fields and the logo). apps/server/src/response-fields.test.ts has a walker for the contact point: it may be declared by exactly the six routes the table names and by no list, member list or membership route, and no event of the module declares a field that carries a value of the record. The field table of a membership arrives with sprint 5; until then the member list is described in prose (usernames and join dates, no state, no role, no address) and checked by the tests in memberships.lists.test.ts and apps/server/src/membership-routes.test.ts (no address in any answer). A page is still a description: the second pass reads the table against the schemas in routes.ts.'
  - id: v5.0.0-8.2.1
    status: pass
    evidence:
      - test: ASVS-8.2.1
      - code: apps/server/src/pipeline/authorize.ts
      - code: packages/contracts/src/route.ts
    note: "Every route declares a permission (or public: true with a reason) or fails at registration; the pipeline denies by default. The walker in defect-01 fails for a route without a decision in its matrix; the six routes of M5 sprint 3 and GET /permissions, GET /system/job-runs of sprint 4 are in it as admin routes (GET /account/permissions as a self-service route), so a plain User, a user without roles, anonymous and a token whose owner is a plain User are refused on each, and apps/server/src/admin-users-routes.test.ts repeats the refusals with the handler's own side effects checked (nothing changes). M6 sprint 3 adds the function-level cases of delegation, tagged in modules/registry-organisations and apps/server: a plain User, a plain member, a person who only asked and a manager of another organisation cannot decide a request, change a role, remove a member, list requests or view members (memberships.decisions.test.ts, memberships.lists.test.ts, defect-01.membership.test.ts); nobody decides on their own request, changes their own role or removes themselves, an Admin and a manager included; a manager cannot remove another manager; a token passes only for the scopes it names and only for what its owner holds, so an Admin or a manager token without the scope is refused, also on a list (which answers 403, not an empty page); and the nine membership routes are rows of the walker in defect-01.privilege-escalation.test.ts, where a plain User gets 403 on each delegated row, which proves the service answer and not the pipeline. M6 sprint 4 adds the function-level cases of editing, tagged in modules/registry-organisations and apps/server: a plain member, a person who only asked, a rejected or former member, a plain User and a manager of another organisation cannot change an organisation or set or remove its logo, and a manager cannot create or delete an organisation, not even their own (editing.test.ts, organisation-editing-routes.test.ts); a manager demoted or removed is refused at the next call; a token passes only for the scopes it names, so a manager or Admin token without the scope of the edit is refused, and a member or a plain User naming the scope gains nothing (editing.test.ts, policy.test.ts, the edit row); and the three edit routes (PATCH, PUT and DELETE logo) are rows of the walker, where a plain User gets 403 from the service (the sample names a real organisation, because an unknown one is 404 first)."
  - id: v5.0.0-8.2.2
    status: pass
    evidence:
      - test: ASVS-8.2.2
      - code: modules/core-authz/service/authz.ts
    note: "Covers the data that exists today: own tokens, sessions, inbox items and profile, and, since M6 sprint 3, memberships of organisations. The object-level case is a manager of organisation A naming a membership of organisation B by id: decide, role, remove, the member list and the filtered list are all 403 and nothing changes (memberships.decisions.test.ts, memberships.lists.test.ts, defect-01.membership.test.ts), the policy organisation.member answers per organisation and reads the membership at every call (policy.test.ts), and the routes that act on the caller's own row (ask, withdraw, leave, the own list) name an organisation and never a membership, so another person's row cannot be named. M6 sprint 4 adds the object-level case of editing: a manager of organisation A naming organisation B by id in PATCH, PUT logo or DELETE logo is refused with 403 and nothing is written, no file is stored, and the logo of B is untouched (editing.test.ts, organisation-editing-routes.test.ts); the same person edits the organisation they do manage. The real service policy of M7 (service.member) is still to come. This is sampling per service, not a systematic IDOR sweep."
  - id: v5.0.0-8.2.3
    status: pass
    evidence:
      - test: ASVS-8.2.3
      - doc: docs/security/authorization.md
      - code: apps/server/src/response-fields.test.ts
      - code: modules/core-identity/validation.ts
    note: 'Scorpion has no field-level permission engine, by decision (M4b Decision 9); field access is kept by construction. Read side: every route returns one fixed response schema, and the tagged walker reads the response schema of every route of the live registry at any depth (arrays, unions, optionals, references) and fails on secretHash, passwordHash, tokenHash, clientSecret, secret, password or token, with the two one-time token responses (token create and rotate) as the only named exceptions; a planted violation is proved to be named. The audit of every response schema found no such field, and a further test in the same file checks the declared event payloads. Write side: every request body is a strict Zod object, so status, roles, userId or any unknown field is a 422, and status and roles change only through their own permissioned routes. Not shown: that a real response holds only what its schema declares (no step validates a response body; services build named fields, and the route tests for tokens, secrets, settings and the audit trail read real responses; docs/backlog.md schedules a check in the contract tests), that a free-form value such as a setting holds no secret-named key, and that a field is right for its reader. That is a review of the tables in docs/security/authorization.md against each schema, not something a test decides. M6 sprint 4 is the first case of field-level write rules by role, kept by construction in one table (service/field-rules.ts): a manager of an organisation who names type, abbreviation or name, alone or with allowed fields, is refused whole with 403, the problem names the field and never a value, and nothing is written, no event is emitted (editing.test.ts and organisation-editing-routes.test.ts, tagged); GET /organisations/{id} returns editableFields computed by the same table, so a screen draws its form from what the server will accept. On the read side the contact point of an organisation shows only to the readers the table names (Admin and the managers of that organisation always, others while the setting is on; editing.test.ts and organisation-routes.test.ts), and the walker in response-fields.test.ts fails if any route outside the six it names declares a contact field or if an event payload of the module declares a field that carries a value. Reads still have one schema per route, so two readers of one route see the same fields except where the table names a reader-dependent field (the contact point, the audit columns, editableFields), which the service computes per caller.'
  - id: v5.0.0-8.3.1
    status: pass
    evidence:
      - test: ASVS-8.3.1
      - code: apps/server/src/pipeline/authorize.ts
      - code: modules/core-authz/service/authz.ts
    note: 'Authorization runs on the server in the pipeline and again in the service (ctx.authz.require); roles sent by a client are ignored (ADR-0014). Navigation hiding in the UI is cosmetic: the catch-all route of the web app opens a page only when the server lists it for the caller (GET /ui/navigation), and a public page must be named in PUBLIC_PAGES with a reason (apps/server/src/ui-routes.test.ts). M5 sprint 2 added two public routes, GET /auth/oidc/providers (id, display name and icon hash only) and GET /bootstrap/status (one boolean), each with its reason and in the generated route table of docs/security/authorization.md, and the sign-in, registration, recovery and first-admin pages; the profile page needs core.identity.profile.read. The page walker in apps/server/src/ui-navigation-routes.test.ts shows a plain User only the profile and public pages, and apps/web/e2e/navigation.spec.ts finds nothing of the administration in their navigation. The administration pages of M5 sprint 3 (users, pending approvals, roles, settings) are registered with a permission, so the same list gives a plain User none of them and the catch-all route answers their paths with 403 (apps/web/e2e/admin.spec.ts). M6 sprint 3 is the first case where the route alone would let everybody through: the delegated membership routes name the plain organisation.read, so the check that keeps a plain User out is the one in the service (ctx.authz.require with the scoped permission and the organisation, ADR-0034). The tagged tests show the service refusing a caller the route accepted (defect-01.membership.test.ts, "turns a plain member, a person who asked and a plain User away at the service though the route accepted them"), and the walker rows of the delegated routes fail if the service check is missing (an unknown id would answer 404 or 200 instead of 403). The prototype that compared the two route designs is apps/server/src/defect-01.delegated-routes-prototype.test.ts. M6 sprint 4 is the second case where the route alone would let everybody through: PATCH /organisations/{id} and the two logo routes name the plain organisation.read, so the check that keeps a plain User, a member and a manager of another organisation out is the one in the service (accessLevel and requireAccess in service/organisations.ts, before blob.put for a logo). The tagged test in apps/server/src/organisation-editing-routes.test.ts (the route alone would let the caller through) shows the same caller reading the organisation (200) and being refused every edit (403), and the walker rows of the three routes fail if the service check is missing.'
  - id: v5.0.0-8.4.1
    status: n/a
    reason: 'Scorpion is single-tenant by design: one instance per deployment (docs/architecture.md, assumption A3), and no tenant concept exists in the code or the schema, so there are no cross-tenant operations to control.'
