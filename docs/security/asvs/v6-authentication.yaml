requirements:
  - id: v5.0.0-6.1.1
    status: fail
    note: 'Not met. Rate limiting is described (architecture.md, ADR-0008, route notes) but no document says how login brute force and credential stuffing are defended, how the controls are configured (the rateLimits setting) and how malicious lockout is avoided. Fix planned in docs/m4b-sprint-plan.md#5-sprint-2-credentials-throttling-and-linking.'
  - id: v5.0.0-6.1.2
    status: fail
    note: 'Not met. No list of context-specific words is documented and none is checked (see 6.2.11). Fix planned in docs/m4b-sprint-plan.md#5-sprint-2-credentials-throttling-and-linking.'
  - id: v5.0.0-6.1.3
    status: fail
    note: 'Not met. The pathways exist (password, OIDC, PAT, first-run token, mail tokens, the create-admin command) but no document lists them together with the controls and strength each must enforce. Fix planned in docs/m4b-sprint-plan.md#5-sprint-2-credentials-throttling-and-linking.'
  - id: v5.0.0-6.2.1
    status: pass
    evidence:
      - test: ASVS-6.2.1
      - code: modules/core-identity/validation.ts
    note: 'PASSWORD_MIN is 8, enforced by the shared password schema (register, reset, change, first-run, create-admin). 8 meets the requirement; 15 is only recommended. The tagged cases are the table-driven password cases in validation.test.ts (8 accepted, 7 refused).'
  - id: v5.0.0-6.2.2
    status: pass
    evidence:
      - test: ASVS-6.2.2
      - code: modules/core-identity/service/recovery.ts
    note: 'POST /account/password changes the password of the signed-in user.'
  - id: v5.0.0-6.2.3
    status: pass
    evidence:
      - test: ASVS-6.2.3
      - code: modules/core-identity/validation.ts
    note: 'The change schema requires both the current and the new password, and a wrong current password changes nothing.'
  - id: v5.0.0-6.2.4
    status: fail
    note: 'Not met (code gap). Only length limits are checked; there is no list of common passwords. Fix planned in docs/m4b-sprint-plan.md#5-sprint-2-credentials-throttling-and-linking.'
  - id: v5.0.0-6.2.5
    status: pass
    evidence:
