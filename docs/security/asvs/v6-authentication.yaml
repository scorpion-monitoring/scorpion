  - id: v5.0.0-6.5.5
    status: pass
    evidence:
      - test: ASVS-6.5.5
      - code: modules/core-identity/service/mail-tokens.ts
      - doc: docs/adr/0026-credential-rules-throttling-and-mail-confirmed-linking.md
    note: 'The reset link and the link that confirms a provider live 10 minutes (RESET_TTL_MS, OIDC_LINK_TTL_MS); the tagged test refuses a reset link a millisecond after and accepts it a millisecond before. The address confirmation link lives 24 hours on a reading that ADR-0026 section 3 explains: it confirms an address and authenticates nobody, so it is not an out-of-band authentication request. That is a reading of the requirement, not a fact; if it is rejected, VERIFICATION_TTL_MS drops to 10 minutes.'
  - id: v5.0.0-6.6.1
    status: n/a
    reason: 'Scorpion sends no one-time password by phone or SMS and holds no phone number for authentication, so the conditions on offering PSTN OTPs cannot be violated.'
  - id: v5.0.0-6.6.2
    status: pass
    evidence:
