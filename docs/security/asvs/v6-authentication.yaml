    note: 'Passes on the documented rationale only, which the requirement allows: Scorpion has no second factor of its own. The rationale and the controls that make up for it (Argon2id, the breach and context checks, the per-address bucket and per-account throttle, 10-minute reset links, no linking by claim, session list and termination, MFA required at the OIDC provider) are in docs/security/authentication.md and ADR-0026. No test proves a rationale. TOTP is in docs/backlog.md.'
