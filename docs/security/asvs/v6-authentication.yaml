  - id: v5.0.0-6.3.1
    status: pass
    evidence:
      - test: ASVS-6.3.1
      - code: modules/core-identity/service/login-throttle.ts
      - doc: docs/security/authentication.md
    note: 'Failed password logins are throttled per account and network and per account alone, with delays that double up to a ceiling and no lockout: over the limit the answer is 429 with Retry-After, before the password is looked at. A name that does not exist is counted and answered the same (the tagged tests compare the answers; a further test compares the time), a success resets the counters, and the person can log in once the delay is over. The per-address strict bucket applies as well (defect 1 and the rate-limit tests). Argon2id and uniform errors are as before. M5 sprint 4: the sign-in page adds the same help line (whom to ask, from the branding settings) under every refusal of a password, so a declined registration and a wrong password still look alike (apps/web/e2e/login.spec.ts compares the refusals). Sprint 4 also writes an inbox item for three identity mails (a registration request to the administrators, an approval, the notice to the holder of an address that somebody tried to register); none of them carries a credential, and the mails whose link is one (reset, verification, provider link) are `sensitive` and never reach an inbox (modules/core-identity/service/mail.test.ts, apps/web/e2e/secrets.spec.ts).'
  - id: v5.0.0-6.3.2
    status: pass
    evidence:
      - code: modules/core-identity/service/bootstrap.ts
      - doc: docs/adr/0010-first-run-token-and-bootstrap-admin.md
    note: 'M5 sprint 3 added the account status deactivated: login, OIDC sign-in, reset and verification links and the register notice treat it like a rejected account (accounts.ts, oidc.ts, oidc-link.ts, recovery.ts; the sign-in answer is the one for a wrong password, tested in admin-users-routes.test.ts). No migration creates an account. The first administrator is created by the create-admin command or by a one-time first-run token, with a name the operator chooses (ADR-0010). No test asserts that a fresh install has zero users.'
