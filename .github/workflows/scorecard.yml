name: Scorecard

# OpenSSF Scorecard (docs/implementation.md §8.3). The action only runs on the repository's default
# branch, which is `dev`, so pushes to `dev` are scored; `main` is reached through releases.
on:
  push:
    branches: [dev]
  schedule:
    - cron: '23 4 * * 2'
  branch_protection_rule:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the SARIF file to code scanning.
      security-events: write
      # Publish the result (badge, api.scorecard.dev) through the GitHub OIDC token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
