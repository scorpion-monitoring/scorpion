name: Screen readers

# The screen-reader gate of the faceted search (M12a sprint 3, item 7; docs/m12a-plan.md §8): Guidepup drives real
# screen readers through the keyboard path of the look `combined` on the component harness (a static page: no
# Docker, no server, no database).
#
# - NVDA on Windows is the gate: it runs on a pull request that touches the faceted search, its scenes or this gate,
#   on every pull request into `release/**`, nightly on `dev` and on demand. Make "Screen reader (NVDA)" a required
#   check of `release/**` in the branch protection.
# - VoiceOver on macOS is not stable on hosted runners (the spike of the sprint), so it runs nightly and on demand
#   for information only (decision Q3) and never fails the workflow.
on:
  pull_request:
    branches: [dev, 'release/**']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the gate has anything to look at: always for a release, the nightly and a manual run; for a pull
  # request into `dev` only when it touches the paths below (a path filter per base branch is not possible in `on`).
  scope:
    name: Screen reader scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [[ "$BASE_REF" == release/* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(packages/ui-kit/src/(FacetSearch\.svelte|facet-search/|facets\.ts|messages-components\.ts|context\.ts)|apps/web/e2e/components/harness/|apps/web/e2e/screen-reader/|\.github/workflows/screen-reader\.yml$|pnpm-lock\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  nvda:
    name: Screen reader (NVDA)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SCREEN_READER: nvda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Set up NVDA
        shell: bash
        run: |
          pnpm --filter @scorpion/web exec guidepup setup --ci
          pnpm --filter @scorpion/web exec guidepup install nvda
      - name: Install the browser
        shell: bash
        run: pnpm --filter @scorpion/web exec playwright install chromium
      - name: Run the keyboard path under NVDA
        shell: bash
        working-directory: apps/web
        run: pnpm exec playwright test --config e2e/screen-reader/playwright.config.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-reader-nvda
          path: apps/web/playwright-report
          retention-days: 14

  voiceover:
    name: Screen reader (VoiceOver, information only)
    needs: scope
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    env:
      SCREEN_READER: voiceover
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Set up VoiceOver
        shell: bash
        run: |
          pnpm --filter @scorpion/web exec guidepup setup --ci
          pnpm --filter @scorpion/web exec guidepup install voiceover
      - name: Install the browser
        shell: bash
        run: pnpm --filter @scorpion/web exec playwright install chromium
      - name: Run the keyboard path under VoiceOver
        shell: bash
        working-directory: apps/web
        run: pnpm exec playwright test --config e2e/screen-reader/playwright.config.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-reader-voiceover
          path: apps/web/playwright-report
          retention-days: 14
