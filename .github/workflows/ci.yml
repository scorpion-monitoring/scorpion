name: CI

# Branch policy: CONTRIBUTING.md, "Branches".
on:
  push:
    branches: [main, dev, 'release/**', 'hotfix/**']
    # A release tag publishes the release images (job `publish`).
    tags: ['v*']
  pull_request:
    branches: [main, dev, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks that need no database or browser. The jobs below run beside it, so the whole run takes as
  # long as its slowest job, not the sum (CONTRIBUTING.md, "Continuous integration").
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the changeset check can diff against the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Branch policy
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/branch-policy.ts "$HEAD_REF" "$BASE_REF"

      # Every pull request adds a changeset (or an empty one); see .changeset/README.md.
      # A Dependabot pull request that changes only dependency files is exempt (scripts/changeset-check.ts);
      # the head branch and the author reach the script as environment variables, never inside run:.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: pnpm changeset:check "origin/$BASE_REF"

      - run: pnpm check

  # Unit and integration tests, split by file over a fixed number of runners; Testcontainers uses each
  # runner's Docker daemon. To add a shard, add its number here and change `/4` in the command.
  unit:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test --shard=${{ matrix.shard }}/4
        env:
          # One report per shard; the ASVS job puts them together.
          JUNIT_FILE: reports/vitest-junit-${{ matrix.shard }}.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-unit-${{ matrix.shard }}
          path: reports/vitest-junit-${{ matrix.shard }}.xml
          retention-days: 1

  # Playwright specs, split over a fixed number of runners; each shard builds the web app and starts its own
  # stacks and database. To add a shard, add its number here and change `/3` in the command.
  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The browser download is cached by the lockfile (it pins Playwright); the system packages
      # `--with-deps` adds are installed on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser
        run: pnpm --filter @scorpion/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          # One report per shard; the ASVS job puts them together. Relative to apps/web, where Playwright runs.
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../../reports/playwright-junit-${{ matrix.shard }}.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-e2e-${{ matrix.shard }}
          path: reports/playwright-junit-${{ matrix.shard }}.xml
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Checks the four ASVS assessments in docs/security/asvs/ against the pinned source and the JUnit
  # reports of the test jobs above, and that the generated reports and the README badge block are what
  # the tool writes (CLAUDE.md, "Security assurance"). CI is strict: a missing report is an error. On a
  # release or hotfix branch it also fails a chapter that is stale (a scoped path changed after its
  # assessed_commit). The branch name reaches the script through the environment.
  asvs:
    name: ASVS assessments
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true
      # The report reader scans test cases, so the shards' files joined are one report.
      - name: Join the test reports of the shards
        run: |
          cat reports/vitest-junit-*.xml > reports/vitest-junit.xml
          cat reports/playwright-junit-*.xml > reports/playwright-junit.xml
      - env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH" in
            release/* | hotfix/*) pnpm security:asvs --release ;;
            *) pnpm security:asvs ;;
          esac

  # The one check that branch protection requires for the tests. It keeps its name, so the jobs above can
  # be split or renamed without touching the ruleset; it fails when any of them failed or was cancelled.
  verify:
    name: Lint, type check, test
    needs: [static, unit, e2e, asvs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a job of the verification did not succeed" >&2
              exit 1
            fi
          done

  # Reads the lockfile only, so it needs no install. Blocks on high and critical advisories in production
  # dependencies that are not in .github/audit-allowlist.json (CONTRIBUTING.md, "Dependency audit").
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm audit:check

  image:
    name: Image (${{ matrix.profile }})
    # Needs only the static checks: the images build beside the tests, and the required check
    # "Lint, type check, test" still stops the merge when a test fails.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The image needs a database to become ready: the smoke test starts it against this one.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: scorpion
          POSTGRES_PASSWORD: scorpion
          POSTGRES_DB: scorpion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scorpion -d scorpion"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `web: true`: the profile has core.ui-shell, so its image also runs the web server (ADR-0027).
          - profile: full
            web: true
          - profile: core-only
            web: true
          # The real profiles are still empty, so a fixture profile proves the mechanism: an image
          # holds exactly the modules of its profile (fixture.a and fixture.b, not fixture.opt).
          - profile: fixture-ab
            profile_file: packages/kernel/test/fixtures/profiles/ab.ts
            modules_root: packages/kernel/test/fixtures/modules
    env:
      IMAGE: scorpion:ci-${{ matrix.profile }}
      PROFILE: ${{ matrix.profile }}
      PROFILE_FILE: ${{ matrix.profile_file }}
      MODULES_ROOT: ${{ matrix.modules_root || 'modules' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PROFILE=${{ matrix.profile }}
            PROFILE_FILE=${{ matrix.profile_file }}
            MODULE_ROOTS=${{ matrix.modules_root || 'modules' }}
          tags: scorpion:ci-${{ matrix.profile }}
          load: true
          cache-from: type=gha,scope=image-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.profile }}

      # The checks below run scripts of the repository, which need the workspace installed.
      - uses: ./.github/actions/setup

      # Lists every @scorpion package in the image (as a link in node_modules and as a package
      # directory) and fails if a module outside the profile is there, or one of the profile is not.
      - name: The image holds only the modules of its profile
        run: |
          node scripts/check-image-modules.ts "$IMAGE" --profile "$PROFILE" \
            ${PROFILE_FILE:+--profile-file "$PROFILE_FILE"} --modules-root "$MODULES_ROOT"

      # The check must be able to fail. Two images that break the rule, made from the fixture image:
      # a module linked into node_modules, and a module directory. Both must be reported; and the
      # fixture image checked against a profile that does not list `fixture.a` must fail too.
      - name: The check fails on an image with a module outside its profile
        if: matrix.profile == 'fixture-ab'
        run: |
          docker build -t scorpion:ci-polluted-link - <<EOF
          FROM $IMAGE
          USER root
          RUN mkdir -p /app/node_modules/@scorpion && ln -s /app/apps/server /app/node_modules/@scorpion/fixture-opt
          EOF
          docker build -t scorpion:ci-polluted-dir - <<EOF
          FROM $IMAGE
          USER root
          RUN mkdir -p /app/modules/leak && echo '{"name": "@scorpion/fixture-opt"}' > /app/modules/leak/package.json
          EOF
          for polluted in scorpion:ci-polluted-link scorpion:ci-polluted-dir; do
            if node scripts/check-image-modules.ts "$polluted" --profile "$PROFILE" \
              --profile-file "$PROFILE_FILE" --modules-root "$MODULES_ROOT"; then
              echo "the check passed an image with a module outside its profile: $polluted" >&2
              exit 1
            fi
          done
          if node scripts/check-image-modules.ts "$IMAGE" --profile fixture-b-only \
            --profile-file packages/kernel/test/fixtures/profiles/b-only.ts --modules-root "$MODULES_ROOT"; then
            echo "the check passed an image against a profile that lacks one of its modules" >&2
            exit 1
          fi

      # The image applies its migrations when it starts. /healthz says the process is alive;
      # /readyz says the database answers and every migration is applied. A profile with the shell runs
      # a web server on 3000 in front of the API on 3001: the web server passes /healthz and /readyz on,
      # serves the start page, and does not pass /metrics (that stays on the API's port).
      - name: Smoke test /healthz, /readyz and /metrics
        env:
          WEB: ${{ matrix.web }}
        run: |
          docker run -d --rm --network host --name scorpion-smoke \
            -e DATABASE_URL=postgres://scorpion:scorpion@127.0.0.1:5432/scorpion \
            -e SECRETS_KEY="$(openssl rand -base64 32)" \
            "$IMAGE"
          for _ in $(seq 1 60); do
            if curl -fsS localhost:3000/healthz && curl -fsS localhost:3000/readyz; then
              if [ "$WEB" = "true" ]; then
                curl -fsS localhost:3000/ | grep -q '<title>'
                curl -fsS localhost:3000/api/internal/ui/navigation | grep -q '"routes"'
                curl -fsS localhost:3001/metrics | grep -q '^scorpion_outbox_lag_seconds'
                test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/metrics)" = 404
              else
                curl -fsS localhost:3000/metrics | grep -q '^scorpion_outbox_lag_seconds'
              fi
              docker stop --timeout 20 scorpion-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs scorpion-smoke
          exit 1

      - name: Smoke test `scorpion migrate` and the profile check
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://scorpion:scorpion@127.0.0.1:5432/scorpion \
            "$IMAGE" node apps/server/src/cli.ts migrate
          if docker run --rm --network host -e PROFILE=not-this-one \
            -e DATABASE_URL=postgres://scorpion:scorpion@127.0.0.1:5432/scorpion \
            "$IMAGE" node apps/server/src/cli.ts start; then
            echo "an image must refuse a PROFILE it was not built for" >&2
            exit 1
          fi

  # Publishes the profile images to the GitHub container registry, so an instance can pull them
  # (CONTRIBUTING.md, "Images in the registry"). It runs only on a push to `dev` and on a release tag, never for a
  # pull request, and only after the gate and the smoke tests of the image job passed. The build reuses the
  # layers the image job cached. `packages: write` is granted to this job alone.
  publish:
    name: Publish (${{ matrix.profile }})
    needs: [verify, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [full, core-only]
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      COMMIT: ${{ github.sha }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release tag v<x.y.z> gives `<x.y.z>-<profile>`; a push to dev gives `dev-<profile>` (the newest dev
      # build) and `dev-<short sha>-<profile>` (a fixed one to roll back to).
      - name: Image tags
        id: tags
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tags="$REGISTRY_IMAGE:${REF_NAME#v}-$PROFILE"
            version="${REF_NAME#v}"
          else
            tags="$REGISTRY_IMAGE:dev-$PROFILE"$'\n'"$REGISTRY_IMAGE:dev-${COMMIT:0:7}-$PROFILE"
            version="dev-${COMMIT:0:7}"
          fi
          {
            echo "version=$version"
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PROFILE=${{ matrix.profile }}
          tags: ${{ steps.tags.outputs.list }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=ISC
          cache-from: type=gha,scope=image-${{ matrix.profile }}
