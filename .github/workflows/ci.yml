name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Unit and integration tests; Testcontainers uses the runner's Docker daemon.
      - run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @scorpion/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  image:
    name: Image (${{ matrix.profile }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [full, denbi-registry, nfdi-onboarding, kpi-tracker]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: PROFILE=${{ matrix.profile }}
          tags: scorpion:ci-${{ matrix.profile }}
          load: true
          cache-from: type=gha,scope=image-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.profile }}

      - name: Smoke test /healthz
        if: matrix.profile == 'full'
        run: |
          docker run -d --rm -p 3000:3000 --name scorpion-smoke scorpion:ci-full
          for _ in $(seq 1 30); do
            if curl -fsS localhost:3000/healthz; then
              docker stop scorpion-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs scorpion-smoke
          exit 1
