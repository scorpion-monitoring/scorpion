# Backing services for local development (`pnpm dev`). Not for production.
name: scorpion-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scorpion
      POSTGRES_PASSWORD: scorpion
      POSTGRES_DB: scorpion
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scorpion -d scorpion']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
