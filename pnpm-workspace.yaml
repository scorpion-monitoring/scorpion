# The root package (`scorpion`) is listed so Changesets can version it: it carries the product
# version and CHANGELOG.md. The internal packages are not versioned separately.
packages:
  - .
  - apps/*
  - packages/*
  - modules/*
  - profiles
  - tools/*
  # Fixture modules for the kernel tests and the per-profile image check. They are workspace
  # packages so that they resolve like real modules, but they are not part of any real profile.
  - packages/kernel/test/fixtures/modules/*

# Install fails if Node or pnpm do not match `engines` in the root package.json.
engineStrict: true

# Install scripts are blocked by default. These are optional native add-ons pulled in by
# Testcontainers (Docker over SSH) and a version-check hook; none is needed here.
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2

# Optional peer dependencies (a module's optional module dependencies) are linked only when the
# profile depends on them itself; nothing installs them on its own.
autoInstallPeers: false

# drizzle-kit pulls in the deprecated @esbuild-kit loader, which pins esbuild 0.18 (GHSA-67mh-4wv8-2f99,
# fixed in 0.25.0). Use the esbuild that drizzle-kit itself uses. Remove when drizzle-kit drops the loader.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # launch-editor <= 2.14.1 has three advisories (fixed in 2.14.2); it comes in only through @changesets/cli (dev).
  # Remove when @changesets/cli requires 2.14.2 or later.
  launch-editor: '>=2.14.2'

# react-grid-layout (a dependency of @snapgridjs/core) declares react and react-dom as peers. Snapgrid imports
# only `react-grid-layout/core`, the pure layout functions, so React is never in the client build and is not
# installed (ADR-0042, Decision 4, amended in sprint 2).
peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
