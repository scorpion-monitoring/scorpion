<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--
      A stored light or dark choice is applied before the first paint, so the page does not flash. The
      script carries the nonce SvelteKit puts in the CSP. "System" (or no choice) sets nothing: the
      DaisyUI themes then follow prefers-color-scheme in CSS alone.
    -->
    <script nonce="%sveltekit.nonce%">
      try {
        const choice = localStorage.getItem('scorpion.theme');
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.dataset.theme = 'scorpion' + choice;
        }
      } catch {
        // No storage (a private window): the system choice stays.
      }
    </script>
    %sveltekit.head%
  </head>
  <!-- `data-hydrated` is "false" until the root layout has mounted, so a browser test knows when the page reacts. -->
  <body
    class="bg-base-100 text-base-content"
    data-sveltekit-preload-data="hover"
    data-hydrated="false"
  >
    <div class="contents">%sveltekit.body%</div>
  </body>
</html>
